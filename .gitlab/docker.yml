stages:
  - build

variables:
  DOCKER_USERNAME: "olegdayo"
  DOCKER_IMAGE: "$DOCKER_USERNAME/example-service"

.build:
  image: docker:27
  stage: build
  needs: []
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - curl -O -L "https://github.com/sigstore/cosign/releases/download/v2.6.2/cosign-linux-amd64"
    - install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
    - echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - curl -f -i -X GET "$MLIST_ADDR/api/models/lookup?repository=${CI_SERVER_HOST}/${CI_PROJECT_PATH}&version=${VERSION}"
    - docker build -t "$DOCKER_IMAGE:$VERSION" .
    - docker push "$DOCKER_IMAGE:$VERSION"
    - IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$DOCKER_IMAGE:$VERSION" | cut -d '@' -f 2)"
    - cosign sign -y --key hashivault://signer $DOCKER_IMAGE:$VERSION@$IMAGE_DIGEST
    - sleep 5
    - cosign verify --key hashivault://signer $DOCKER_IMAGE:$VERSION@$IMAGE_DIGEST

build-latest:
  extends: .build
  variables:
    VERSION: latest
  stage: build
  only:
    - master

build-version-tag:
  extends: .build
  variables:
    VERSION: $CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
