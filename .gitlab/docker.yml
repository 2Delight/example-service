stages:
  - build

variables:
  DOCKER_USERNAME: "olegdayo"
  DOCKER_IMAGE: "$DOCKER_USERNAME/example-app"
  DOCKER_TLS_CERTDIR: "/certs"

.setup-docker:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
    - install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
    - echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin

build_latest:
  extends: .setup-docker
  stage: build
  script:
    - VERSION=latest
    - docker build -t "$DOCKER_IMAGE:$VERSION" .
    - docker push "$DOCKER_IMAGE:$VERSION"
    - IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$DOCKER_IMAGE:$VERSION")"
    - cosign sign --key hashivault://signer $DOCKER_IMAGE:$VERSION@IMAGE_DIGEST
    - sleep 5
    - cosign verify --key hashivault://signer $DOCKER_IMAGE:$VERSION@IMAGE_DIGEST
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

build_version_tag:
  extends: .setup-docker
  stage: build
  script:
    - VERSION=$CI_COMMIT_TAG
    - docker build -t "$DOCKER_IMAGE:$VERSION" .
    - docker push "$DOCKER_IMAGE:$VERSION"
    - IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$DOCKER_IMAGE:$VERSION")"
    - cosign sign --key hashivault://signer $DOCKER_IMAGE:$VERSION@IMAGE_DIGEST
    - sleep 5
    - cosign verify --key hashivault://signer $DOCKER_IMAGE:$VERSION@IMAGE_DIGEST
  rules:
    - if: '$CI_COMMIT_TAG'
