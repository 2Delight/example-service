stages:
  - upload

.upload:
  image: amazon/aws-cli:2.34.44
  stage: upload
  needs: []
  parallel:
    matrix:
      - WEIGHTS:
        - 'yolov8n'
        - 'yolov8s'
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl
    - curl -O -L "https://github.com/sigstore/cosign/releases/download/v2.6.2/cosign-linux-amd64"
    - install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
  script:
    - mkdir ./s3-weights
    - mv ./weights/$WEIGHTS.pt ./s3-weights
    - cosign sign-blob -y --key hashivault://signer --bundle ./s3-weights/$WEIGHTS.json ./s3-weights/$WEIGHTS.pt
    - aws --endpoint-url https://storage.yandexcloud.net sync ./s3-weights s3://example-service/$VERSION

upload-latest:
  extends: .upload
  variables:
    VERSION: latest
  only:
    - master

upload-version-tag:
  extends: .upload
  variables:
    VERSION: $CI_COMMIT_TAG
  rules:
    - if: '$CI_COMMIT_TAG'
