stages:
  - upload

.upload:
  image: alpine:3.22.4
  stage: upload
  needs: []
  parallel:
    matrix:
      - WEIGHTS:
        - 'yolov8n'
        - 'yolov8s'
  services:
    - docker:27-dind
  before_script:
    - apk add --no-cache curl aws-cli
    - curl -O -L "https://github.com/sigstore/cosign/releases/download/v2.6.2/cosign-linux-amd64"
    - install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign
  script:
    - mkdir ./s3-weights
    - mv ./weights/$WEIGHTS.pt ./s3-weights
    - cosign sign-blob -y --key hashivault://signer --bundle ./s3-weights/$WEIGHTS.json ./s3-weights/$WEIGHTS.pt
    - aws --endpoint-url https://storage.yandexcloud.net s3 sync ./s3-weights s3://mlops3/example-service/$VERSION

upload-latest:
  extends: .upload
  variables:
    VERSION: latest
  only:
    - master

upload-version-tag:
  extends: .upload
  variables:
    VERSION: $CI_COMMIT_TAG
  only:
    - tags
  except:
    - branches
